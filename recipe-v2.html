<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わが家のレシピメモ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }

  header {
    background: #ff7043;
    color: white;
    padding: 16px 24px;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  header h1 { font-size: 1.4rem; }
  header p { font-size: 0.75rem; opacity: 0.9; margin-top: 2px; }

  .container { max-width: 600px; margin: 0 auto; padding: 16px; }

  #notice {
    display: none;
    background: #fff3e0;
    border: 1px solid #ffb74d;
    color: #6d4c00;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.85rem;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  #notice button {
    margin-top: 8px;
    background: #ff7043; color: white; border: none;
    border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 0.85rem;
  }

  .form-card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
  }

  .form-card h2 { font-size: 1rem; margin-bottom: 14px; color: #ff7043; }

  label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 4px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }

  input[type="text"], input[type="url"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 56px; font-size: 0.95rem; }
  input:focus, textarea:focus { border-color: #ff7043; }

  /* 分類の選択（フォーム内） */
  .cat-select { display: flex; gap: 8px; }
  .cat-btn {
    flex: 1;
    padding: 10px 6px;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: white;
    font-size: 0.95rem;
    cursor: pointer;
    color: #888;
  }
  .cat-btn.active-yummy { border-color: #ff7043; background: #fff3f0; color: #e64a19; font-weight: bold; }
  .cat-btn.active-want { border-color: #26a69a; background: #e0f2f1; color: #00796b; font-weight: bold; }

  .upload-area {
    border: 2px dashed #ddd;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
  }
  .upload-area:hover { border-color: #ff7043; background: #fff3f0; }
  .upload-area input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-area .icon { font-size: 2rem; }
  .upload-area p { font-size: 0.85rem; color: #999; margin-top: 6px; }

  #preview-wrap { margin-top: 10px; display: none; }
  #preview-wrap img { width: 100%; border-radius: 8px; max-height: 200px; object-fit: cover; }
  #preview-wrap button {
    margin-top: 6px; font-size: 0.8rem; background: none; border: none;
    color: #f44336; cursor: pointer;
  }

  .btn-add {
    width: 100%;
    padding: 12px;
    background: #ff7043;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 16px;
    transition: background .2s;
  }
  .btn-add:hover { background: #e64a19; }
  .btn-add:disabled { background: #bcaaa4; cursor: wait; }

  /* 一覧のタブ */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    flex: 1;
    padding: 11px 6px;
    border: none;
    border-radius: 10px;
    background: #e0e0e0;
    font-size: 0.95rem;
    cursor: pointer;
    color: #666;
  }
  .tab-btn.active-yummy { background: #ff7043; color: white; font-weight: bold; }
  .tab-btn.active-want { background: #26a69a; color: white; font-weight: bold; }

  .recipe-list { display: flex; flex-direction: column; gap: 12px; }

  .recipe-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .recipe-thumb {
    width: 80px; height: 80px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: #f5f5f5;
  }
  .recipe-thumb-placeholder {
    width: 80px; height: 80px;
    border-radius: 8px;
    background: #ffe0d6;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
  }

  .recipe-info { flex: 1; min-width: 0; }
  .recipe-info h3 { font-size: 1rem; margin-bottom: 4px; }
  .recipe-info a {
    font-size: 0.8rem; color: #ff7043; word-break: break-all;
    text-decoration: none;
  }
  .recipe-info a:hover { text-decoration: underline; }
  .recipe-date { font-size: 0.75rem; color: #aaa; margin-top: 4px; }

  .recipe-comment {
    background: #fff8e1;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.85rem;
    line-height: 1.6;
    margin-top: 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .comment-actions { margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-comment {
    background: none; border: none; color: #f9a825; cursor: pointer;
    font-size: 0.8rem; padding: 0;
  }
  .btn-move {
    background: #fff3f0; border: 1px solid #ff7043; color: #e64a19; cursor: pointer;
    font-size: 0.8rem; padding: 5px 10px; border-radius: 6px; margin-top: 8px;
  }
  .comment-edit-area { margin-top: 8px; }
  .comment-edit-area textarea { min-height: 64px; }
  .comment-edit-btns { display: flex; gap: 6px; margin-top: 6px; }
  .comment-edit-btns button { border: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 0.85rem; }
  .btn-save-comment { background: #ff7043; color: white; }
  .btn-cancel-comment { background: #eee; }

  .edit-input {
    width: 100%; font-size: 1rem; font-weight: bold;
    border: none; border-bottom: 2px solid #ff7043;
    outline: none; background: transparent; padding: 2px 0;
  }

  .btn-delete {
    background: none; border: none; color: #ccc; cursor: pointer;
    font-size: 1.2rem; flex-shrink: 0;
    transition: color .2s;
  }
  .btn-delete:hover { color: #f44336; }

  .empty { text-align: center; color: #aaa; padding: 40px 0; font-size: 0.9rem; line-height: 1.7; }
  .empty button {
    margin-top: 10px;
    background: #ff7043; color: white; border: none;
    border-radius: 6px; padding: 8px 18px; cursor: pointer; font-size: 0.9rem;
  }

  .search-wrap { margin-bottom: 16px; }
  .search-wrap input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
  }
  .search-wrap input:focus { border-color: #ff7043; }

  .backup-wrap { text-align: center; margin: 20px 0 4px; }
  .backup-wrap button {
    background: none; border: 1px solid #ccc; color: #777;
    border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 0.85rem;
  }
  .backup-wrap p { font-size: 0.75rem; color: #aaa; margin-top: 6px; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <h1>🍽️ わが家のレシピメモ</h1>
  <p>改良版（データが消えにくい版）</p>
</header>

<div class="container">

  <div id="notice"></div>

  <!-- 追加フォーム -->
  <div class="form-card">
    <h2>レシピを追加</h2>

    <label>分類</label>
    <div class="cat-select">
      <button type="button" class="cat-btn" id="cat-btn-yummy" onclick="setFormCat('yummy')">🍽️ 美味しかった</button>
      <button type="button" class="cat-btn" id="cat-btn-want" onclick="setFormCat('want')">👩‍🍳 作りたい</button>
    </div>

    <label>料理名 *</label>
    <input type="text" id="dish-name" placeholder="例：鶏むね肉のガーリックソテー">

    <label>レシピURL（任意）</label>
    <input type="url" id="recipe-url" placeholder="https://...">

    <div id="comment-field">
      <label>コメント（任意）</label>
      <textarea id="dish-comment" placeholder="例：子どもがおかわりした。次は少し辛めに作る"></textarea>
    </div>

    <label>スクショ（任意）</label>
    <div class="upload-area" id="upload-area">
      <input type="file" id="file-input" accept="image/*">
      <div class="icon">📷</div>
      <p>タップして画像を選択</p>
    </div>
    <div id="preview-wrap">
      <img id="preview-img" src="" alt="プレビュー">
      <button onclick="clearImage()">✕ 画像を削除</button>
    </div>

    <button class="btn-add" onclick="addRecipe()">追加する</button>
  </div>

  <!-- タブ -->
  <div class="tabs">
    <button type="button" class="tab-btn" id="tab-yummy" onclick="setTab('yummy')">🍽️ 美味しかった</button>
    <button type="button" class="tab-btn" id="tab-want" onclick="setTab('want')">👩‍🍳 作りたい</button>
  </div>

  <!-- 検索 -->
  <div class="search-wrap">
    <input type="text" id="search" placeholder="🔍 料理名で検索..." oninput="renderList()">
  </div>

  <!-- 一覧 -->
  <div class="recipe-list" id="recipe-list"></div>

  <!-- バックアップ -->
  <div class="backup-wrap">
    <button onclick="exportBackup()">📥 バックアップを保存</button>
    <p>レシピの一覧・分類・コメント・画像を1つのファイルに保存します。<br>ときどき保存しておくと、万一のときに戻せます。</p>
  </div>

</div>

<script>
// ===== 設定（元のアプリと全く同じサーバーを使う） =====
const API = 'https://script.google.com/macros/s/AKfycbwRQFlvxm1Z29Z5Gju6RVxLTcUGTw9m7mRBJ0EtBdZ-fda1h5kwvWZHtcFUwZfdqxwb/exec';
const CACHE_KEY = 'recipe_list_cache_v2';   // 改良版専用：レシピ一覧の控え
const META_KEY = 'recipe_meta_v2';          // 改良版専用：分類・移動後の日付・コメント
const OLD_IMAGE_KEY = 'recipe_images';      // 元のアプリの画像保存キー（読み取り専用で引き継ぐ）

let imageDataUrl = null;
let recipes = [];
let imagesMap = {};        // { id(String): dataURL } IndexedDBから読み込んだ画像
let meta = {};             // { id(String): {cat:'yummy'|'want', date:'', comment:''} }
let serverError = false;   // サーバー読み込みに失敗したかどうか
let currentTab = 'yummy';  // 表示中のタブ
let formCat = 'yummy';     // 追加フォームで選んでいる分類

// ===== 分類・コメントなどの補助情報（スマホ側に保存） =====
function loadMeta() {
  try {
    const v = JSON.parse(localStorage.getItem(META_KEY) || '{}');
    return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  } catch (e) { return {}; }
}
function saveMeta() {
  try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) { /* 本体は止めない */ }
}
function getCat(r) {
  const m = meta[String(r.id)];
  if (m && (m.cat === 'yummy' || m.cat === 'want')) return m.cat;
  if (r.cat === 'yummy' || r.cat === 'want') return r.cat;
  return 'yummy'; // 元のアプリのレシピは全部「美味しかった」
}
function getDate(r) {
  const m = meta[String(r.id)];
  return (m && m.date) ? m.date : (r.date || '');
}
function getComment(r) {
  const m = meta[String(r.id)];
  if (m && typeof m.comment === 'string') return m.comment;
  return (typeof r.comment === 'string') ? r.comment : '';
}
function setMeta(id, patch) {
  const key = String(id);
  meta[key] = Object.assign({}, meta[key] || {}, patch);
  saveMeta();
}

// ===== IndexedDB（画像用の大きな保存場所） =====
const DB_NAME = 'recipe_v2_db';
const STORE = 'images';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbImagesMap() {
  const db = await openDB();
  return await new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const store = tx.objectStore(STORE);
    const keysReq = store.getAllKeys();
    const valsReq = store.getAll();
    tx.oncomplete = () => {
      const map = {};
      keysReq.result.forEach((k, i) => { map[String(k)] = valsReq.result[i]; });
      resolve(map);
    };
    tx.onerror = () => reject(tx.error);
  });
}

async function idbSet(id, dataUrl) {
  const db = await openDB();
  return await new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(dataUrl, String(id));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbDelete(id) {
  const db = await openDB();
  return await new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(String(id));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// 元のアプリがlocalStorageに保存した画像を、消さずにコピーして引き継ぐ
async function migrateOldImages() {
  try {
    const old = JSON.parse(localStorage.getItem(OLD_IMAGE_KEY) || '{}');
    for (const [id, url] of Object.entries(old)) {
      if (!imagesMap[String(id)] && typeof url === 'string' && url.startsWith('data:image')) {
        try { await idbSet(id, url); imagesMap[String(id)] = url; } catch (e) { /* 1枚失敗しても続ける */ }
      }
    }
  } catch (e) { /* 元データが読めなくても本体は動かす */ }
}

// ===== レシピ一覧の控え（サーバーが読めないとき用） =====
function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(recipes)); } catch (e) { /* 控えが書けなくても本体は動かす */ }
}
function loadCache() {
  try {
    const v = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}

// ===== お知らせ表示 =====
function showNotice(html) {
  const el = document.getElementById('notice');
  el.innerHTML = html;
  el.style.display = 'block';
}
function hideNotice() {
  const el = document.getElementById('notice');
  el.innerHTML = '';
  el.style.display = 'none';
}

// ===== サーバー通信 =====
// 成功したら配列を返す。失敗（通信エラー／ログイン画面が返る等）したら例外にする。
async function fetchServerList() {
  const res = await fetch(API);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error('not-json'); }
  if (!Array.isArray(data)) throw new Error('not-array');
  return data;
}

// 追加・編集・削除用。Googleのログイン画面（HTML）が返ったら失敗とみなす。
async function callServer(params) {
  const res = await fetch(API + '?' + params);
  const text = await res.text().catch(() => '');
  if (text && text.trim().startsWith('<!DOCTYPE')) throw new Error('login-required');
  if (!res.ok) throw new Error('http-' + res.status);
  return text;
}

async function loadFromServer(pendingRecipe) {
  const el = document.getElementById('recipe-list');
  if (recipes.length === 0) el.innerHTML = '<div class="empty">読み込み中...</div>';
  try {
    const data = await fetchServerList();
    recipes = data.slice().reverse();
    // サーバー確認が取れなかった追加分があれば、消さずに先頭に残す
    if (pendingRecipe && !recipes.some(r => String(r.id) === String(pendingRecipe.id))) {
      recipes.unshift(pendingRecipe);
    }
    serverError = false;
    saveCache();
    hideNotice();
  } catch (e) {
    serverError = true;
    if (pendingRecipe && !recipes.some(r => String(r.id) === String(pendingRecipe.id))) {
      recipes.unshift(pendingRecipe);
      saveCache();
    }
    if (recipes.length > 0) {
      showNotice('サーバーから読み込めなかったため、<b>前回表示したデータを表示しています。データは消えていません。</b><br>Googleのログインが切れているときに起きやすいです。<br><button onclick="loadFromServer()">もう一度読み込む</button>');
    } else {
      showNotice('サーバーから読み込めませんでした。<b>データが消えたとは限りません。</b><br>Googleのログインが切れているときに起きやすいです。通信のよい場所で、もう一度読み込んでみてください。<br><button onclick="loadFromServer()">もう一度読み込む</button>');
    }
  }
  renderList();
}

// ===== 分類の切り替え =====
function setFormCat(cat) {
  formCat = cat;
  document.getElementById('cat-btn-yummy').className = 'cat-btn' + (cat === 'yummy' ? ' active-yummy' : '');
  document.getElementById('cat-btn-want').className = 'cat-btn' + (cat === 'want' ? ' active-want' : '');
  // コメント欄は「美味しかった」のときだけ出す
  document.getElementById('comment-field').style.display = (cat === 'yummy') ? 'block' : 'none';
}
function setTab(cat) {
  currentTab = cat;
  setFormCat(cat); // 見ている分類のまま追加できるようにそろえる
  renderList();
}
function updateTabs() {
  const yummyCount = recipes.filter(r => getCat(r) === 'yummy').length;
  const wantCount = recipes.filter(r => getCat(r) === 'want').length;
  const ty = document.getElementById('tab-yummy');
  const tw = document.getElementById('tab-want');
  ty.textContent = '🍽️ 美味しかった（' + yummyCount + '）';
  tw.textContent = '👩‍🍳 作りたい（' + wantCount + '）';
  ty.className = 'tab-btn' + (currentTab === 'yummy' ? ' active-yummy' : '');
  tw.className = 'tab-btn' + (currentTab === 'want' ? ' active-want' : '');
}

// ===== 画像の選択（自動で圧縮する） =====
document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    try {
      const MAX = 1024;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX || h > MAX) {
        if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      imageDataUrl = canvas.toDataURL('image/jpeg', 0.82);
    } catch (err) {
      imageDataUrl = null;
    }
    URL.revokeObjectURL(url);
    if (imageDataUrl) {
      document.getElementById('preview-img').src = imageDataUrl;
      document.getElementById('preview-wrap').style.display = 'block';
      document.getElementById('upload-area').style.display = 'none';
    } else {
      // 圧縮に失敗したら元の読み方に切り替える
      const reader = new FileReader();
      reader.onload = ev => {
        imageDataUrl = ev.target.result;
        document.getElementById('preview-img').src = imageDataUrl;
        document.getElementById('preview-wrap').style.display = 'block';
        document.getElementById('upload-area').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('画像を読み込めませんでした'); };
  img.src = url;
});

function clearImage() {
  imageDataUrl = null;
  document.getElementById('file-input').value = '';
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('upload-area').style.display = 'block';
}

// ===== 追加 =====
async function addRecipe() {
  const name = document.getElementById('dish-name').value.trim();
  if (!name) { alert('料理名を入力してください！'); return; }
  const url = document.getElementById('recipe-url').value.trim();
  const comment = (formCat === 'yummy') ? document.getElementById('dish-comment').value.trim() : '';

  const btn = document.querySelector('.btn-add');
  btn.textContent = '保存中...';
  btn.disabled = true;

  const id = Date.now();
  const date = new Date().toLocaleDateString('ja-JP');
  const newRecipe = { id, name, url: url || '', date };

  // 分類とコメントはスマホ側に保存する
  setMeta(id, { cat: formCat, comment: comment });

  // 画像は先に大きな保存場所へ。失敗してもレシピ自体の保存は止めない。
  let imageFailed = false;
  if (imageDataUrl) {
    try {
      await idbSet(id, imageDataUrl);
      imagesMap[String(id)] = imageDataUrl;
    } catch (e) { imageFailed = true; }
  }

  let serverFailed = false;
  try {
    const params = new URLSearchParams({ action: 'add', id, name, url: url || '', date });
    await callServer(params);
  } catch (e) { serverFailed = true; }

  if (serverFailed) {
    // サーバーに届かなくても、このスマホに控えを残して表示する
    if (!recipes.some(r => String(r.id) === String(id))) {
      recipes.unshift(newRecipe);
      saveCache();
    }
    currentTab = formCat;
    renderList();
    alert('サーバーに保存できませんでしたが、このスマホには保存しました。\n通信やGoogleのログインを確認してください。' + (imageFailed ? '\n※画像は保存できませんでした' : ''));
  } else {
    if (imageFailed) alert('レシピは保存しましたが、画像は保存できませんでした');
    currentTab = formCat;
    await loadFromServer(newRecipe);
  }

  document.getElementById('dish-name').value = '';
  document.getElementById('recipe-url').value = '';
  document.getElementById('dish-comment').value = '';
  clearImage();
  btn.textContent = '追加する';
  btn.disabled = false;
}

// ===== 削除 =====
async function deleteRecipe(id) {
  if (!confirm('削除する？')) return;
  try {
    const params = new URLSearchParams({ action: 'delete', id });
    await callServer(params);
  } catch (e) {
    alert('サーバーに接続できなかったため、削除できませんでした。\n通信やGoogleのログインを確認して、もう一度試してください。');
    return;
  }
  try { await idbDelete(id); } catch (e) { /* 画像削除の失敗は一覧に影響させない */ }
  delete imagesMap[String(id)];
  delete meta[String(id)];
  saveMeta();
  recipes = recipes.filter(r => String(r.id) !== String(id));
  saveCache();
  await loadFromServer();
}

// ===== 名前の編集 =====
function startEdit(id) {
  const recipe = recipes.find(r => String(r.id) === String(id));
  if (!recipe) return;
  const wrap = document.getElementById('title-wrap-' + id);
  wrap.innerHTML = `
    <div style="display:flex;gap:6px;align-items:center">
      <input type="text" class="edit-input" id="edit-input-${id}" value="${escHtml(recipe.name)}">
      <button onclick="saveEdit(${id})" style="background:#ff7043;color:white;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap">保存</button>
      <button onclick="renderList()" style="background:#eee;border:none;border-radius:6px;padding:4px 8px;cursor:pointer">✕</button>
    </div>`;
  document.getElementById('edit-input-' + id).focus();
}

async function saveEdit(id) {
  const input = document.getElementById('edit-input-' + id);
  const newName = input.value.trim();
  if (!newName) return;
  input.disabled = true;
  try {
    const params = new URLSearchParams({ action: 'edit', id, name: newName });
    await callServer(params);
  } catch (e) {
    alert('サーバーに接続できなかったため、変更を保存できませんでした。\n通信やGoogleのログインを確認して、もう一度試してください。');
    input.disabled = false;
    return;
  }
  const recipe = recipes.find(r => String(r.id) === String(id));
  if (recipe) { recipe.name = newName; saveCache(); }
  await loadFromServer();
}

// ===== コメントの編集（美味しかったレシピ用・スマホ側に保存） =====
function startCommentEdit(id) {
  const recipe = recipes.find(r => String(r.id) === String(id));
  if (!recipe) return;
  const wrap = document.getElementById('comment-wrap-' + id);
  wrap.innerHTML = `
    <div class="comment-edit-area">
      <textarea id="comment-input-${id}" placeholder="例：子どもがおかわりした。次は少し辛めに作る">${escHtml(getComment(recipe))}</textarea>
      <div class="comment-edit-btns">
        <button class="btn-save-comment" onclick="saveComment(${id})">保存</button>
        <button class="btn-cancel-comment" onclick="renderList()">✕</button>
      </div>
    </div>`;
  document.getElementById('comment-input-' + id).focus();
}

function saveComment(id) {
  const input = document.getElementById('comment-input-' + id);
  const text = input.value.trim();
  setMeta(id, { comment: text });
  renderList();
}

// ===== 作りたい → 美味しかったへ移動 =====
function moveToYummy(id) {
  const recipe = recipes.find(r => String(r.id) === String(id));
  if (!recipe) return;
  const today = new Date().toLocaleDateString('ja-JP');
  setMeta(id, { cat: 'yummy', date: today });
  currentTab = 'yummy';
  setFormCat('yummy');
  renderList();
  showNotice('「' + escHtml(recipe.name) + '」を美味しかったに移動しました。<br>感想はカードの「💬 コメント」から付けられます。');
}

// ===== 一覧表示 =====
function renderList() {
  updateTabs();
  const q = document.getElementById('search').value.trim().toLowerCase();
  const inTab = recipes.filter(r => getCat(r) === currentTab);
  const filtered = inTab.filter(r => !q || (r.name || '').toLowerCase().includes(q) || getComment(r).toLowerCase().includes(q));
  const el = document.getElementById('recipe-list');

  if (filtered.length === 0) {
    if (recipes.length === 0 && serverError) {
      el.innerHTML = '<div class="empty">読み込めませんでした。<br>データが消えたとは限りません。<br><button onclick="loadFromServer()">もう一度読み込む</button></div>';
    } else if (inTab.length === 0 && currentTab === 'yummy') {
      el.innerHTML = '<div class="empty">まだレシピがないよ！<br>美味しかった料理を追加しよう🍴</div>';
    } else if (inTab.length === 0 && currentTab === 'want') {
      el.innerHTML = '<div class="empty">作りたいレシピはまだありません。<br>作ってみたい料理を追加しよう👩‍🍳</div>';
    } else {
      el.innerHTML = '<div class="empty">見つかりませんでした</div>';
    }
    return;
  }

  el.innerHTML = filtered.map(r => {
    const cat = getCat(r);
    const comment = getComment(r);
    return `
    <div class="recipe-card">
      ${imagesMap[String(r.id)]
        ? `<img class="recipe-thumb" src="${escHtml(imagesMap[String(r.id)])}" alt="${escHtml(r.name)}">`
        : `<div class="recipe-thumb-placeholder">🍽️</div>`
      }
      <div class="recipe-info">
        <div id="title-wrap-${r.id}">
          <h3 style="display:flex;align-items:center;gap:6px">${escHtml(r.name)} <button onclick="startEdit(${r.id})" style="background:none;border:none;cursor:pointer;font-size:0.9rem;padding:0">✏️</button></h3>
        </div>
        ${r.url ? `<a href="${escHtml(r.url)}" target="_blank" rel="noopener">🔗 レシピを見る</a>` : ''}
        <div class="recipe-date">${escHtml(getDate(r))}</div>
        ${cat === 'yummy' ? `
        <div id="comment-wrap-${r.id}">
          ${comment ? `<div class="recipe-comment">💬 ${escHtml(comment)}</div>` : ''}
          <div class="comment-actions">
            <button class="btn-comment" onclick="startCommentEdit(${r.id})">${comment ? '💬 コメントを直す' : '💬 コメントを付ける'}</button>
          </div>
        </div>` : `
        <button class="btn-move" onclick="moveToYummy(${r.id})">作った！美味しかったへ移動</button>`}
      </div>
      <button class="btn-delete" onclick="deleteRecipe(${r.id})">🗑️</button>
    </div>`;
  }).join('');
}

// ===== バックアップ書き出し =====
async function exportBackup() {
  try { imagesMap = await idbImagesMap(); } catch (e) { /* 手元の画像一覧で書き出す */ }
  const data = {
    app: 'recipe-v2',
    exportedAt: new Date().toISOString(),
    recipes: recipes,
    meta: meta,
    images: imagesMap
  };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  const ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = 'recipe-backup-' + ymd + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== 起動 =====
async function init() {
  meta = loadMeta();
  setFormCat('yummy');
  recipes = loadCache();
  if (recipes.length > 0) renderList();
  try {
    imagesMap = await idbImagesMap();
    await migrateOldImages();
  } catch (e) { imagesMap = {}; }
  if (recipes.length > 0) renderList();
  await loadFromServer();
}
init();
</script>
